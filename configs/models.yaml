mechanistic_candidates:
  - id: qwen3_5_4b
    hf_id: Qwen/Qwen3.5-4B
    role: exploratory neuron-steering / instrumentation feasibility candidate
    status: reproduce an existing open workflow with matched controls; not yet selected for the primary mechanistic claim
    note: verify GPU VRAM, model revision, inference fork, behavioral task accuracy, and whether the exact steering intervention is supported
  - id: qwen3_8b
    hf_id: Qwen/Qwen3-8B
    role: provisional primary mechanistic model; dense causal transformer; manageable scale
    status: pilot first; replace if it lacks enough canonical and transformed-item accuracy
  - id: gemma3_12b
    hf_id: google/gemma-3-12b-it
    role: cross-family mechanistic replication candidate
    status: secondary; requires architecture/tooling feasibility check

selection_rules:
  - compare instruct-tuned models for the main behavioral question; do not mix base and instruct checkpoints in one roster without a preregistered reason
  - require canonical accuracy >= 0.50 on the primary task family for inclusion in retention estimates; retain lower-capability results descriptively
  - select at least three model families; do not select models solely from leaderboard rank
  - record full model ID, immutable revision/commit, tokenizer, chat template, serving engine, dtype/quantization, and release date
  - treat reasoning-mode settings as a separate factor; freeze one primary mode and report a matched sensitivity analysis
