# Study settings. Source of truth: research/docs/programme_architecture.md + research/docs/research_design.md, research/docs/eval_suite.md, research/docs/root_abilities.md.
study:
  id: rr_v3
  status: design
  direction_date: 2026-11-04

  primary_question: >-
    For a specific reasoning failure, can we measure where a model breaks,
    find an internal signal that predicts the failure before it happens,
    and use that signal for a targeted fix that beats generic fixes at
    equal cost, as a pipeline that runs on any new open model?

  supporting_prediction_question: >-
    Do process measures predict specific failures on an unseen task family
    beyond overall ability, difficulty, domain and a knowledge-skill profile?

  pipeline: [frontier_check, measure, predict, localize, fix_verify, generalize, front_end]

  baselines:
    baseline_1: overall ability
    baseline_2: >-
      baseline_1 + difficulty + domain + ADeLe-style skill profile;
      evaluate on both failure occurrence and failure type
    baseline_3: baseline_2 + process measures (root-ability ladder profiles)
  metrics: [auc, log_loss]
  cross_validation: by_family

  gating_rule: >-
    stages after measurement gate on RQ1 (reliable behavioural contrast), not RQ3;
    hidden-family result is a reported checkpoint; Stage 0 frontier check first

  first_demo:
    proposed_failures: [state_loss, looping]
    status: proposed_not_frozen
    note: end-to-end measure to localize to fix to verify; not all 8 abilities equally

  dimensions:
    status: root abilities with 4-level ladders; see research/docs/root_abilities.md
    profile: ladder breaking points per ability
    spine: [R1, R2, R3, R4, R5, R6, R7, R8]
    out_of_scope: [coordination_with_another_actor]
    control: knowledge   # prerequisite tests, not a dimension

  families:
    profiling:
      - A_planning_and_greedy_traps
      - B_long_state_tracking_and_compound_goals
      - C_code_execution_output_prediction
      - D_maths_word_problems_with_twins
      - E_logic_and_rule_worlds
    proposed_profiling:
      - G_long_horizon_memory   # multi-session changing facts; not finalized
    hidden_family: deterministic tool-use sandbox (seeds in data/private/)
    minimum_profiling_families: 5

  items:
    population_claims: >-
      about 300 structural items per family (50 famous, 50 twins, 200 fresh),
      start k=5, adaptive expansion
    per_problem_claims: 60 items per family at k=20
    surface_versions_per_item: about 5
    final_counts: from power simulation after the pilot
    independent_unit: generated item or template cluster, never the repeated call

  split:
    development: 0.4
    confirmation: 0.6

  decoding:
    primary: temperature above 0 at each model card's recommended settings
    check_set: small greedy subset
    thinking: planned factor (on and off)

  repeated_runs:
    start_k: 5
    expansion: add samples only where the interval straddles the decision threshold (pre-registered stopping rule)
    noise_floor: rerun a fixed subset across batch sizes and seeds; per-item verdicts only above it

  pass_at_k: [1, 4, 8]

  factor_model:
    baseline: 2PL
    main: bifactor

  simulations:
    model_counts: [6, 8, 12, 20, 30]
    nulls: [zero_specific_factors, format_template_noise]
    notes:
      - match item difficulty across abilities
      - use real pilot ability spread
      - target roughly 12 or more relatively independent models for recovery

  harness_check:
    stat: kendall_tau
    bootstrap: items

  accuracy_band: [0.30, 0.80]

  confidence_signals:
    signals: [written_confidence, k_sample_agreement, gold_logprob, jev_probability, rule_based_feature_score]
    report: [brier, reliability_diagram, auroc]
    split_by: [family, famous_vs_fresh_twin]
    independence:
      - jev distractors come from the generator, never from evaluated-model samples
      - agreement on samples 1 to k; correctness scored on held-out sample k+1

  analysis:
    model: "correct ~ variant x protocol x model + (1 + variant | item) + (1 | template)"
    intervals: cluster bootstrap over templates
    multiple_testing: Holm
    primary_contrasts: few, pre-registered; the rest exploratory
    sensitivity:
      - random effect per model family in model-item regression
      - also report B3 vs B2 with one variant per family

  instruction_drift:
    levels: [none, show_working, final_answer_only]
    crossed_with: thinking_on_off
    note: own pre-registered contrast; reference effect size for later variants

  stage0_frontier_check:
    ladders: [L1, L2, L3]
    models_note: Opus, Fable, Astra, GLM and peers; pin exact strings on run day
    gate: frontier models break somewhere; if not, extend ladders first

  stage3_pass_bars:
    probes: at least +0.05 AUROC over question-only and text-only baselines, CI excluding 0
    patching: at least 50% of the pass/fail gap recovered from 3 or fewer layers
    steering_ablation: effect beyond the 95th percentile of random-direction controls, with a dose response

  stage4_baselines:
    matched: same data volume, steps and compute, no targeting
    strong: generic check-your-work prompting, and RL on pooled generators
    mismatch_control: fix meant for a different weakness
    always_measure: what each fix breaks
    also_measure: reliability per unit of cost

  compute_allocation:
    status: product_research_direction
    method: risk_based_token_budgeting
    inputs: [model_breaking_points, task_demands, live_uncertainty, activation_probes]
    demand_tagger: open_challenge

  reliability_front_end:
    capabilities: [query_rewriting, runtime_monitoring, adaptive_compute]
    calibration_tasks: about 20 to 50 real customer tasks

  preregistration_required_before_confirmatory_runs: true
