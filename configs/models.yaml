# Model roster. Source of truth: research/docs/research_design.md.
# Rule: every model must create a contrast; leaderboard rank alone is never a reason.
# Pin exact Hugging Face revision hashes (or API model strings + date) on run day.

roster:
  exposure_and_stages:
    - id: olmo3_7b
      model: OLMo 3 7B
      checkpoints: [base, sft, dpo, instruct, think]
      contrast: which training stage creates fragility; real exposure counts from public data (Dolma 3)
      used_for: [behaviour, exposure, mechanism, fix]
      hardware: L4 or A100
      revision: PIN ON RUN DAY

  thinking_toggle:
    - id: qwen_27b
      model: Qwen3.6-27B (hybrid thinking)
      contrast: thinking on vs off on the same weights (the v1 confound as a clean factor)
      used_for: [behaviour]
      hardware: A100 80GB
      revision: PIN ON RUN DAY
      note: verify exact name and thinking toggle on the model card
    - id: qwen_small
      model: small Qwen3.5 (0.8B to 9B range)
      contrast: same family at small size
      used_for: [behaviour, mechanism]
      hardware: L4
      revision: PIN ON RUN DAY
      note: check thinking toggle on the model card

  interp_tools:
    - id: gemma3
      model: Gemma 3 (4B or 12B) instruct
      contrast: ready-made SAEs and transcoders on every layer (Gemma Scope 2)
      used_for: [behaviour, mechanism]
      hardware: L4 or A100
      revision: PIN ON RUN DAY

  reasoning_trained:
    - id: gpt_oss_20b
      model: gpt-oss-20b
      contrast: reasoning-trained recipe
      used_for: [behaviour, mechanism_partial]
      hardware: A100
      revision: PIN ON RUN DAY
      note: MoE; mechanism work is harder

  bridge_to_v1:
    - id: llama31_8b
      model: Llama 3.1 8B Instruct
      contrast: links to v1 data; exposure replication family
      used_for: [behaviour, exposure]
      hardware: L4
      revision: PIN ON RUN DAY

  # GLM is open-weight frontier-by-performance (local or API). DeepSeek/Kimi are API
  # candidates. Target about 3 to 4 for Stage 0 and behavioural checks.
  open_frontier:
    - id: glm_5_x
      model: GLM-5.x
      access: open_weight_or_api
      contrast: frontier scale with open weights
      used_for: [behaviour, frontier_sanity_check]
      revision: PIN MODEL STRING AND DATE
    - id: deepseek_v4_x
      model: DeepSeek V4.x
      access: api
      contrast: frontier scale
      used_for: [behaviour, frontier_sanity_check]
      revision: PIN MODEL STRING AND DATE
    - id: kimi_k3
      model: Kimi K3
      access: api
      contrast: frontier scale
      used_for: [behaviour, frontier_sanity_check]
      revision: PIN MODEL STRING AND DATE

  # Behaviour and Stage 0 only. Exact panel size open (about 3 to 4 affordable).
  # Examples from Nov 4 discussion; pin exact strings on run day.
  closed_panel:
    - id: opus
      model: Claude Opus (current frontier; e.g. Opus 5.5 class)
      used_for: [behaviour, frontier_sanity_check]
      revision: PIN MODEL STRING AND DATE
    - id: fable
      model: Claude Fable (e.g. Fable 5.1 class)
      used_for: [behaviour, frontier_sanity_check]
      revision: PIN MODEL STRING AND DATE
    - id: gpt_astra
      model: GPT-6 Astra class (or current OpenAI frontier)
      used_for: [behaviour, frontier_sanity_check]
      revision: PIN MODEL STRING AND DATE
      note: >-
        Discussion cites MIT CSAIL weight-edit results as inspiration for
        looping fixes; numbers not independently verified for this project
    - id: gemini
      model: Gemini (specific model TBD)
      used_for: [behaviour, frontier_sanity_check]
      revision: PIN MODEL STRING AND DATE

  non_llm_baseline:
    - id: jev
      model: Jev (TypeSafe AI)
      contrast: recognition-only baseline; later a router
      used_for: [behaviour_feature, router]
      revision: PIN VERSION, never jev-latest
      limits: fixed-option tasks only; distractors from the generator; not a judge; not for untrusted text

pilot_roster: [qwen_27b_thinking_on, qwen_27b_thinking_off, olmo3_7b_instruct, jev]

optional_mechanistic_candidates:
  - id: qwen35_4b
    model: Qwen3.5-4B
    reason: open neuron-steering workflow exists; feasibility only
  - id: qwen3_8b
    model: Qwen3-8B
    reason: dense, tractable; feasibility only

dropped:
  - model: Llama 4 Scout
    reason: 109B total weights, too large (needs multiple GPUs)
  - model: Gemma 4 31B
    reason: no matching interp tools (Gemma Scope 2 targets Gemma 3)

rules:
  - stage_0_frontier_check_mandatory: true
  - if_frontier_models_dont_break: extend_ladders_before_building_instrument
  - closed models are behaviour-only; never used for exposure or mechanism claims
  - record model ID, revision hash, tokenizer, chat template, engine, precision, release date
  - thinking on/off is a planned factor, never a hidden setting
  - tune difficulty so each model lands at about 30 to 80 percent accuracy
  - bifactor recovery simulations target roughly 12 or more relatively independent models
